[package]
name = "difftest"
description = "Differential oracles: CGAL Arrangement_2 (circular kernel) and OpenCascade shape checker via a C++ FFI shim. NEVER in a certified path — an oracle, compared against stored answers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fixtures.workspace = true
# The C++ FFI (CGAL / OpenCascade, JSON in/out) is behind the `cgal` feature so
# the default workspace build needs no system C++ libs. `nix develop` (CI) ships
# CGAL 6.2 + gmp/mpfr/boost; build with `--features cgal`.
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"

[dev-dependencies]
# The CGAL differential harness compares our arrangement (arrange2d, over the
# geom/lattice types) against the CGAL oracle; proptest drives the inputs.
arrange2d.workspace = true
geom.workspace = true
lattice.workspace = true
certify-core.workspace = true
proptest = "1"

[features]
# The CGAL Arrangement_2 (circular kernel) differential oracle.
cgal = ["dep:cxx"]
