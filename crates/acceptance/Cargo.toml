[package]
name = "acceptance"
description = "The canonical acceptance parts — ONE definition of each device, shared by the demos, the V&V pins, and the benchmark, so a measurement and the pin that guards it can never drift onto different geometry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lattice.workspace = true
certify-core.workspace = true
author.workspace = true
develop.workspace = true
geom.workspace = true
arrange2d.workspace = true
export.workspace = true
fixtures.workspace = true

# The device's inner cut is a **file** (`data/inner-cut.dxf`), so the catalogue that owns the device
# owns the read of it. This is the one edge into the file boundary, and it points the safe way:
# `interchange` sits *below* here and *above* nothing certified, so no crate in the trusted path
# acquires a file-format dependency. The acceptance test that used to live in `interchange/tests`
# moved here with it (`tests/imported_outline.rs`) rather than being kept alive by a dev-dep cycle.
interchange.workspace = true
