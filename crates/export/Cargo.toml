[package]
name = "export"
description = "STEP + mesh + marks: planar trims of ruled faces, rational patches with IDEALIZED flags, the mesh size-field cap, dimension/mark layers, GRID-closure rounding ledger (M8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Floats are permitted ONLY here, behind this flag — plots/viewers/diagnostics.
# A float that reaches a predicate is a bug (spec invariant 1); the
# no-float-certified lint guards the pure crates.
diagnostics = []
# The OCCT-backed real `.step` writer (a `cxx` C++ FFI shim to OpenCASCADE's
# STEPControl_Writer). Off by default so the default build/CI needs no system
# OCCT; build with `--features step` under `nix develop`. Mirrors difftest's `cgal`.
step = ["dep:cxx"]

[dependencies]
lattice.workspace = true
certify-core.workspace = true
geom.workspace = true
arrange2d.workspace = true
closure.workspace = true
sew.workspace = true
gate.workspace = true
develop.workspace = true
# The OCCT STEP shim (behind `step`) — no OCCT type crosses the FFI; strings/paths only.
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
# The `gallery` example + the `svg` unit/doc tests render the public demo shapes.
fixtures.workspace = true

# Emits `gallery.html`: `cargo run --example gallery --features diagnostics`. Gated on the
# `diagnostics` feature so the default build/clippy never compiles the float renderer.
[[example]]
name = "gallery"
required-features = ["diagnostics"]

# Emits `cone.html`: `cargo run --example cone --features diagnostics` (add `--vendor <dir>`
# to inline Three.js for offline use). Gated on `diagnostics` like the gallery renderer.
[[example]]
name = "cone"
required-features = ["diagnostics"]

# Emits `cone_flat.svg`: `cargo run --example cone_flat --features diagnostics` — the certified
# flat unrolling of the device cone (develop::unroll, direction ①). Gated like the other renderers.
[[example]]
name = "cone_flat"
required-features = ["diagnostics"]

# Emits the Stage-1 flex-PCB panel (G7 finale): `cargo run --example flex_panel --features
# diagnostics` for the pipeline + `flex_panel.svg` (add `,step` under `nix develop` for STEP I/II).
# The whole certified chain unroll→hole→fold→STEP over a wide two-sided cone gore.
[[example]]
name = "flex_panel"
required-features = ["diagnostics"]

# Emits the DD.1 round-trip panel: `cargo run --example roundtrip_panel --features diagnostics` for
# the pipeline + `roundtrip_panel.svg` (add `,step` under `nix develop` for the annulus STEP solid).
# Boundaries cut in 3D → develop → an interior feature authored in 2D + folded back onto the cone.
[[example]]
name = "roundtrip_panel"
required-features = ["diagnostics"]
