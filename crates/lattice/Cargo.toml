[package]
name = "lattice"
description = "Exact-arithmetic substrate: L0 fixed-limb fast path + BigInt slow path, polynomial arithmetic, Sturm, resultants. Pure, no_std — the base of the TCB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Bignum backend chosen at M0 by benchmark (docs/lattice-backend-benchmark.md):
# dashu — passes the no_std+alloc gate, ties malachite for fastest on the
# deg-12/256-bit Sturm yardstick, native integer + rational types. Behind the
# `backend::Backend` trait, so the choice stays swappable and the no_std boundary
# lives at this crate's API. `default-features = false` = no_std + alloc.
dashu = { version = "0.4", default-features = false }

[features]
# `fuzzing` exposes the differential-fuzz core (`ratfuzz`) + its TEST/FUZZ-ONLY seed
# constructors (`RefBackend::int_from_le_bytes`) to the out-of-tree `cargo-fuzz` crate
# (`fuzz/`). NEVER enabled in the shipped build — the gate keeps those unproven helpers
# physically out of the `Backend` trait and the Aeneas lift. Under `cargo test` the same
# code is reached via the `test` cfg, so `#[cfg(any(test, feature = "fuzzing"))]`.
#
# It also turns on dashu's `tuning` feature so the fuzz target can pull the multiply-algorithm
# thresholds DOWN (env vars) and exercise Karatsuba/Toom-3/NTT at small, oracle-cheap sizes.
# `tuning` pulls `std` into dashu — fine, the fuzz build is a std binary; the no_std gate build
# uses default features (fuzzing off), so it is unaffected.
fuzzing = ["dashu/tuning"]

[lints.rust]
# Kani injects `--cfg kani`; register it so `#[cfg(kani)]` proof modules do not
# trip `unexpected_cfgs` under `clippy --all-targets -- -D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
# Runtime differential coverage (tests only; never in the shipped crate):
# proptest drives boundary-weighted inputs (fast≡slow + tier canonicalization),
# and an INDEPENDENT second bignum backend (num-bigint + num-rational) is the
# oracle for the dashu≡2nd-backend row.
proptest = "1"
num-bigint = "0.4"
num-rational = "0.4"
