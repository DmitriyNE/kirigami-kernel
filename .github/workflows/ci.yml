name: ci

on:
  push:
  pull_request:

# CI runs INSIDE the pinned Nix devShell so "CI == local"
# (docs/environment-and-crate-layout.md §4). Both first-class targets are in the
# matrix: x86_64-linux (self-hosted runner, labels [self-hosted, Linux, x64]) and
# aarch64-darwin (GitHub-hosted macos-latest). runs-on takes the label list for the
# Linux leg — a runner must carry ALL listed labels — and the macos-latest string
# for the darwin leg.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, x64]
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    # Nix resolves `github:` flake INPUTS through api.github.com, and authenticates with
    # whatever `access-tokens` it finds. On this runner that fetch returned **401 "Bad
    # credentials"** — not 403, so a credential WAS being sent and rejected — 19 seconds after
    # the installer had been handed a valid `github-token`, which rules out expiry-during-job.
    # No `access-tokens` entry was found in /etc/nix/nix.conf or the login user's config, so the
    # source is not pinned down; a GitHub-hosted runner is a fresh VM each job and never sees it.
    # `NIX_CONFIG` is applied AFTER every config file, so injecting the current job's token here
    # wins over whatever is set wherever. If a 401 survives this, the token itself is being
    # rejected and the staleness reading was wrong (see #241(b)).
    env:
      NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          # Don't push/pull FlakeHub Cache: it needs a FlakeHub subscription + a GitHub
          # OIDC id-token, which a self-hosted runner can't provide, so the action blocks
          # on auth. Disabling it falls back to the local /nix/store + the public binary
          # caches (cache.nixos.org + the installer's) — the actual blocker, gone. (The
          # Magic Nix Cache's GitHub-Actions backend is deprecated anyway, and a self-hosted
          # runner keeps /nix/store across jobs, so the cache layer buys little here.)
          use-flakehub: false

      - name: spec + code invariant lints (:= census, tuple-predicate, vv-matrix gate)
        run: nix develop --command cargo xtask lint

      - name: fmt
        run: nix develop --command cargo fmt --all --check

      - name: clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: test (incl. the corpus regression suite)
        run: nix develop --command cargo nextest run --workspace
      - name: doctests (nextest does not run these)
        run: nix develop --command cargo test --workspace --doc

      # Differential-fuzz regression replay (stable, NO libFuzzer/nightly): re-runs the
      # checked-in `int_chain` crash corpus through the `dashu ≡ proven RefBackend` op-chain
      # differential, under the same lowered dashu `tuning` thresholds the fuzzer uses (so a
      # pinned crash reproduces faithfully). The deterministic per-PR half; the coverage-guided
      # *search* is the nightly `fuzz-nightly.yml` cron. The threshold-straddling seed programs
      # are already replayed by the `replay_seed_corpus` unit test in the `nextest` step above.
      # `--features fuzzing` builds `ratfuzz` + dashu `tuning`; it is never in the shipped crate.
      - name: fuzz regression replay (committed crash corpus)
        run: nix develop --command cargo test -p lattice --features fuzzing --test fuzz_replay

      # M3a Phase 5: the CGAL Arrangement_2 differential oracle (the first CI run of
      # `--features cgal` — builds the C++ FFI shim) together with the degenerate-heavy
      # stratum pass (ARRANGE_STRATUM_WEIGHT over-samples the tangent/coincident/
      # concurrent strata). The differential agrees with CGAL up to the quotient
      # (exact a+b√d); the stratum suite re-runs arrange2d's property tests weighted
      # toward degeneracy.
      - name: CGAL differential + degenerate-heavy stratum suite
        run: nix develop --command bash -c 'ARRANGE_STRATUM_WEIGHT=8 cargo nextest run -p arrange2d -p difftest --features cgal'

      # M-D: the OpenCASCADE STEP export + differential oracle (the first CI run of
      # `--features step` — builds the OCCT cxx shim). Covers the slice-1 one-joint
      # STEP round-trip tests AND slice-2's `export::differential` harness (OCCT
      # BRepCheck free-edge/manifold facts compared against the internal SEW-LINK /
      # CAP-OUT verdict, oracle ∧ audit). The default `--workspace` legs above pass
      # no `--features`, so `export::step` is compiled out there — this is its only
      # CI coverage. `clippy` too, so the cxx `unsafe` surface is lint-gated.
      - name: OCCT STEP export + differential oracle (--features step)
        run: nix develop --command bash -c 'cargo clippy -p export --features step --all-targets -- -D warnings && cargo nextest run -p export --features step && cargo test -p export --features step --doc'

      # The vv-guide §6/§8 milestone gate (a LANDED ★ vv-matrix row must carry a
      # {Kani ∨ Lean ∨ runtime-checked-hypothesis} proof cell) now runs inside
      # `cargo xtask lint`, above (the `vv-matrix gate` check).

      # no_std + alloc gate: the pure-tier `lattice` (and its dashu backend) must
      # build for a bare-metal, std-less target. This is the standing form of the
      # M0 backend benchmark's hard no_std gate (docs/lattice-backend-benchmark.md).
      - name: no_std gate (lattice → thumbv7em-none-eabi)
        run: nix develop --command cargo build -p lattice --target thumbv7em-none-eabi

      # Kani panic-/overflow-freedom harnesses for the L0 fast path (vv-guide §5/§8).
      # gcc + z3 come from the devShell. The kani-verifier install/bundle is not yet
      # cached and the exact version is pinned at the §7 extraction spike, so this is
      # scoped to the fast (loop-free) harnesses; the CBMC-expensive gcd-loop
      # correctness harnesses are covered by tests until the spike hardens them.
      #
      # Kani is NOT in nixpkgs, so this is the one step that reaches outside the flake's
      # hermeticity: `cargo install` drops `cargo-kani` in `$CARGO_HOME/bin`, which a
      # nix-controlled PATH inside `nix develop` does not carry. A GitHub-hosted runner
      # happens to have it on PATH already and a minimal self-hosted one does not, so the
      # step passed on darwin and died on linux with `cargo-kani` missing. Put it on PATH
      # explicitly rather than rely on the runner's own environment.
      #
      # The export goes OUTSIDE `nix develop`, not inside the `bash -c` string: `nix develop`
      # inherits the ambient PATH (verified — a dev box finds `cargo-kani` in it with no export
      # at all, which is also why this failure cannot be reproduced locally), and keeping the
      # expansion in the outer shell avoids quoting it through a single-quoted `-c` payload.
      - name: Kani (lattice fast-path panic-freedom + M3d cocycle + M2 CLIP-σ soundness)
        run: |
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          nix develop --command bash -c '
            cargo install --locked kani-verifier && cargo-kani setup &&
            cargo kani -p lattice \
              --harness neg_sign_panic_free_full_domain \
              --harness cmp_panic_free_full_domain \
              --harness floor_ceil_fast_path_panic_free_full_domain \
              --harness sign_variations_matches_reference &&
            cargo kani -p certify-core \
              --harness cocycle_implies_telescoping \
              --harness link_ok_iff_no_pinch \
              --harness link_iso_matches_cyclic_adjacency \
              --harness clip_sigma_signed_disjunction_sound \
              --harness eps_phi_is_endpoint_order \
              --harness cap_in_cycle_census_sound \
              --harness wedge_clearing_sound \
              --harness occupancy_row_sound \
              --harness gate_conj_sound'

      # Lean extraction / proof surface (vv-guide §7 spike). Builds `certify-check`
      # (hand-written specs + the Sturm hypothesis-checker + the Aeneas-lifted
      # `sign_variations` model), fetching Mathlib's prebuilt oleans + the Aeneas
      # Lean library. Uses the default shell (elan + lake); the hax/Aeneas *binaries*
      # (`.#extraction`) are only needed to *re-generate* models, not to build them.
      # Then audits the axiom footprint of every theorem the checkers rely on: clean
      # is [propext, Classical.choice, Quot.sound], and a `sorryAx` or a named axiom
      # fails. The one legitimate exception — a labelled cited axiom on a 📌 ledger
      # row — is declared PER-THEOREM in the script, so it cannot leak onto any other
      # proof. Build + audit both live in `scripts/check-axioms.sh` so the Lean gate
      # is one command locally too.
      - name: Lean (certify-check proof surface + axiom audit)
        run: nix develop --command bash scripts/check-axioms.sh

      # Extraction TCB guard: every `core` item Aeneas externalises has a faithful
      # `def` model in Lattice/FunsExternal.lean (no `axiom` — which would enter the
      # certified footprint without being sorryAx). Pure bash on committed files;
      # the `extraction-drift` workflow additionally regenerates + drift-checks.
      - name: Extraction externals coverage (faithful FunsExternal models)
        run: bash scripts/check-externals.sh

      # Custom dylint lint (rustc_private / nightly): the type-aware `no_float` is the SOLE
      # gate for invariant 1 (no floats in certified paths) — it catches float *literals*
      # (`1.5`, or the tuple access `x.1.0`, carries no `f32`/`f64` token and text can't judge
      # it) AND `f32`/`f64` *types* (fn sigs, fields, casts, generic args). It replaced the
      # former `cargo xtask lint` token scan. Scoped to the certified crates' *lib* targets
      # (`-p`, no `--all-targets`): floats are intentionally allowed in tests (oracles,
      # generators, readable expectations — a test float can't reach a predicate). Runs on the
      # runner's rustup toolchain, NOT in nix — dylint manages its own pinned nightly via
      # lints/no_float/rust-toolchain.toml. Heavy (installs cargo-dylint + fetches the nightly
      # + builds clippy_utils).
      - name: dylint (no-float in certified paths — literals + types)
        run: |
          cargo install --locked cargo-dylint dylint-link
          cargo dylint --all -- -p lattice -p certify-core -p arrange2d

      # Added as their targets land:
      #   - the *_correct_i16 fast≡slow Kani harnesses, once the spike's loop-bounded
      #     gcd model makes them tractable
      # (the milestone-gate vv-matrix check and the stratum-weighted suite are now
      #  active — see the steps above.)
