# Pinned dev/CI Rust toolchain. Edition 2024 (MSRV floor 1.85); this pins the
# exact stable used for building, testing, clippy, and fmt across both
# first-class targets. The verification tools (Kani, hax, Charon/Aeneas) bring
# their own toolchains and are pinned by version in the Nix flake — see
# docs/environment-and-crate-layout.md §2.
[toolchain]
channel = "1.96.0"
components = ["rust-src", "clippy", "rustfmt"]
# `thumbv7em-none-eabi` is the no_std+alloc gate target: `lattice` (already
# `#![no_std]`) must build for it, which proves the chosen bignum backend is
# genuinely std-free. See docs/lattice-backend-benchmark.md.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "thumbv7em-none-eabi"]
profile = "minimal"
