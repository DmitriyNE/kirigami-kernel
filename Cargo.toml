# Kirigami kernel — workspace manifest (certified-exact geometry for formed flexible-PCB substrates).
# Layout is authoritative in docs/environment-and-crate-layout.md §1:
#   pure tier (no_std, the extraction surface + TCB): lattice, certify-core
#   shell tier ("kernel-search", std, tested + differentially checked): the rest
# The Lean extraction target lives in certify-check/ (a lake project, not a crate).
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The backend-selection benchmark is a throwaway, self-contained workspace under
# benchmarks/ (its own Cargo.lock). Excluded so criterion + all four candidate
# bignum crates never enter this lockfile or the `--workspace --all-targets`
# CI gate. See docs/lattice-backend-benchmark.md.
exclude = ["benchmarks/*", "lints/*", "fuzz"]

# Custom dylint lints (nightly / rustc_private; run via `cargo dylint --all`). Each is its
# own workspace-excluded crate with a pinned nightly — see lints/ and docs/engineering-log.md.
[workspace.metadata.dylint]
libraries = [{ path = "lints/no_float" }]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"   # edition-2024 floor; dev/CI pin in rust-toolchain.toml
publish = false          # not a crates.io library; license: internal, decide later

[workspace.dependencies]
# Internal crates, referenced elsewhere as `<name>.workspace = true`.
lattice = { path = "crates/lattice" }
certify-core = { path = "crates/certify-core" }
geom = { path = "crates/geom" }
arrange2d = { path = "crates/arrange2d" }
closure = { path = "crates/closure" }
sew = { path = "crates/sew" }
gate = { path = "crates/gate" }
develop = { path = "crates/develop" }
export = { path = "crates/export" }
fixtures = { path = "crates/fixtures" }
difftest = { path = "crates/difftest" }
author = { path = "crates/author" }
interchange = { path = "crates/interchange" }
acceptance = { path = "crates/acceptance" }

# Tests run exact rational arithmetic in bulk; at the default `opt-level = 0` the suite spends most
# of its time in unoptimized bignum code. Optimize the test/dev profiles but KEEP `debug-assertions`
# and `overflow-checks` (their defaults here) — a two-tier lattice that silently wrapped would be a
# correctness bug, not a performance one, and these are exactly the tests that would catch it.
#
# `debug = "line-tables-only"` keeps what we actually read — file:line in a backtrace or a panic —
# and drops the type/variable DWARF we never open a debugger for. On macOS cargo defaults to
# `split-debuginfo = "unpacked"`, so that DWARF does not live in the binary: it stays in the
# per-codegen-unit `.o` files, which the linker only records a debug map into and cargo never
# collects. With full `debug` those objects reached 40 GB across ~400k files (one set per feature
# × rustflag × toolchain permutation, none ever reclaimed).
[profile.test]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 2
debug = "line-tables-only"
