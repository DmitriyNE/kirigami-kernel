[package]
name = "xtask"
description = "Project task runner. Holds the repo's spec/code invariant lints (vv-guide §6) in Rust — replacing scripts/lint/*.sh: cross-platform, unit-tested, zero-dependency. Run via `cargo xtask lint`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately dependency-free (std only): the lints are simple line/table scans, so
# `xtask` adds nothing to the workspace lockfile and builds instantly.
[dependencies]
