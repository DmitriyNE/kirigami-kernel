[package]
name = "selector"
version = "0.0.0"
edition = "2024"
publish = false

# Speed yardstick: a degree-12 Sturm polynomial-remainder-sequence over ~240-bit
# rational coefficients, run once per gate-passing rational-capable backend
# (dashu, num-rational, malachite) via a uniform `Rat` trait. Timed by criterion
# (benches/prs.rs); ibig is integer-only → excluded from the rational yardstick.
[lib]
path = "src/lib.rs"

[[bench]]
name = "prs"
harness = false

[dependencies]
dashu = "0.4"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
malachite = "0.4"

[dev-dependencies]
criterion = "0.5"
