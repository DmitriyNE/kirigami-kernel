name = "certify-check"
defaultTargets = ["CertifyCheck", "Lattice", "CertifyCore"]

# Pins locked at the vv-guide §7 spike, downstream of the chosen Aeneas release
# (Aeneas's Lean backend targets Lean v4.31.0 → lean-toolchain; Mathlib follows
# Lean) — see docs/environment-and-crate-layout.md §3.

# Mathlib — git form matches the Aeneas Lean library's own `require mathlib`
# (same URL + tag), so lake resolves a single shared Mathlib (no source conflict).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0" # matches lean-toolchain (leanprover/lean4:v4.31.0)

# The Aeneas Lean backend library — imported by the Aeneas-lifted models
# (`LiftProbe.Funs` etc.). Pinned to the same Aeneas rev the flake builds.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "3a8586facab25b31bdb1e1f5f45acd60d1cc5ff0"
subDir = "backends/lean"

# Shared faithful models of `core` items externalised by more than one crate lift
# (the `?`-operator glue), imported by both `Lattice.FunsExternal` and `CertifyCore.FunsExternal`.
[[lean_lib]]
name = "CommonExtern"

# Hand-written specs + the Sturm checker + the equivalence proofs.
[[lean_lib]]
name = "CertifyCheck"

# The Aeneas-lifted model of `crates/lattice`'s `sturm::sign_variations`
# (generated by charon→aeneas; imports the `Aeneas` Lean library).
[[lean_lib]]
name = "Lattice"

# The Aeneas-lifted model of `crates/certify-core`'s slice-3e `arrange` link checkers
# (v_boundary / link_ok / link_iso_ok) — the second extraction surface. Self-contained:
# its `FunsExternal.lean` is empty (no core-library holes).
[[lean_lib]]
name = "CertifyCore"
